<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Directory</title>
<style>
:root {
  --bg: #0a0e27;
  --panel: #11152d;
  --ink: #e8ecf2;
  --mute: #8b95b3;
  --line: #1e2847;
  --navy: #6b9eff;
  --accent: #00d4ff;
  --glow: #6b9eff40;
}

* { box-sizing: border-box }

html, body { margin: 0; padding: 0 }

body {
  background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1433 100%);
  color: var(--ink);
  font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at 20% 50%, rgba(107, 158, 255, 0.1) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

aside {
  background: linear-gradient(180deg, rgba(17, 21, 45, 0.9) 0%, rgba(17, 21, 45, 0.7) 100%);
  border-right: 1px solid var(--line);
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
  backdrop-filter: blur(10px);
}

aside h1 {
  font: 700 20px/1.2 "Courier New", monospace;
  margin: 0 8px 4px;
  color: var(--navy);
  text-shadow: 0 0 20px rgba(107, 158, 255, 0.5);
  animation: fadeInDown .6s ease-out;
}

aside p {
  margin: 0 8px 14px;
  color: var(--mute);
  font-size: 13px;
  animation: fadeInUp .6s ease-out .2s backwards;
}

.dept {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  border: 1px solid transparent;
  background: rgba(255, 255, 255, 0.05);
  color: var(--ink);
  padding: 11px 12px;
  border-radius: 10px;
  font: inherit;
  cursor: pointer;
  text-align: left;
  transition: all .3s cubic-bezier(.34, .1, .64, 1);
  margin: 4px 0;
}

.dept:hover {
  background: rgba(107, 158, 255, 0.15);
  border-color: var(--navy);
  transform: translateX(4px);
  box-shadow: 0 0 15px var(--glow);
}

.dept[aria-current="true"] {
  background: linear-gradient(135deg, rgba(107, 158, 255, 0.3) 0%, rgba(0, 212, 255, 0.2) 100%);
  color: #fff;
  border-color: var(--navy);
  box-shadow: 0 0 20px var(--glow), inset 0 0 20px rgba(107, 158, 255, 0.2);
}

.dept b {
  font-weight: 600;
  font-size: 12px;
  opacity: .9;
  padding: 2px 8px;
  background: rgba(107, 158, 255, 0.2);
  border-radius: 4px;
  border: 1px solid rgba(107, 158, 255, 0.3);
}

main {
  padding: 24px 28px;
  min-width: 0;
  animation: fadeIn 1s ease-out;
}

.top {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
  animation: slideDown .5s ease-out;
}

.top h2 {
  font: 700 32px/1.1 "Courier New", monospace;
  margin: 0;
  background: linear-gradient(135deg, var(--navy) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.top span {
  color: var(--mute);
  font-size: 14px;
  font-style: italic;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
  animation: slideUp .5s ease-out .1s backwards;
}

input[type=search], select {
  font: inherit;
  color: var(--ink);
  background: rgba(17, 21, 45, 0.8);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  transition: all .3s ease;
  backdrop-filter: blur(10px);
}

input[type=search]::placeholder {
  color: var(--mute);
  opacity: .7;
}

input[type=search]:focus, select:focus {
  outline: none;
  border-color: var(--navy);
  box-shadow: 0 0 20px var(--glow), inset 0 0 10px rgba(107, 158, 255, 0.1);
  background: rgba(17, 21, 45, 1);
}

input[type=search] { flex: 1 1 240px; }

.wrap {
  background: rgba(17, 21, 45, 0.6);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow-x: auto;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  animation: fadeIn .8s ease-out;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 760px;
}

th {
  position: sticky;
  top: 0;
  background: rgba(17, 21, 45, 0.95);
  text-align: left;
  font-weight: 600;
  color: var(--navy);
  font-size: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  transition: all .3s ease;
}

th:hover {
  background: rgba(107, 158, 255, 0.1);
  color: var(--accent);
}

td {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(30, 40, 71, 0.6);
  vertical-align: top;
  animation: fadeIn .3s ease-out;
}

tbody tr {
  cursor: pointer;
  transition: all .2s ease;
  animation: slideIn .4s ease-out;
}

tbody tr:hover {
  background: rgba(107, 158, 255, 0.1);
  transform: scale(1.01);
  box-shadow: 0 5px 20px rgba(107, 158, 255, 0.15);
}

td.n { font-weight: 600; color: var(--accent); }
td.m { color: var(--mute); font-size: 13px; }

.empty {
  padding: 60px 40px;
  text-align: center;
  color: var(--mute);
  animation: fadeIn .5s ease-out;
}

#card {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 39, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 5;
  backdrop-filter: blur(5px);
  animation: fadeIn .3s ease-out;
}

#card.on { display: flex; }

.id {
  background: linear-gradient(135deg, rgba(17, 21, 45, 0.95) 0%, rgba(17, 21, 45, 0.85) 100%);
  width: min(480px, 100%);
  max-height: 92vh;
  overflow: auto;
  border-radius: 16px;
  border: 1px solid var(--line);
  border-top: 3px solid;
  border-top-color: var(--navy);
  padding: 24px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--glow);
  animation: popScale .4s cubic-bezier(.34, .1, .64, 1);
}

@keyframes popScale { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.id h3 {
  font: 700 24px/1.2 "Courier New", monospace;
  margin: 0 0 4px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--navy) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.id .sub {
  color: var(--mute);
  margin-bottom: 16px;
  font-size: 14px;
}

.id dl {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 12px 16px;
  margin: 0;
}

.id dt {
  color: var(--navy);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.id dd {
  margin: 0;
  word-break: break-word;
  color: var(--ink);
}

.btns {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
  animation: slideUp .5s ease-out .2s backwards;
}

.btns a, .btns button {
  font: inherit;
  padding: 10px 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(17, 21, 45, 0.8);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  transition: all .3s ease;
}

.btns a:hover, .btns button:hover {
  background: rgba(107, 158, 255, 0.2);
  border-color: var(--navy);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px var(--glow);
}

.btns a.p {
  background: linear-gradient(135deg, var(--navy) 0%, var(--accent) 100%);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 5px 20px var(--glow);
}

.btns a.p:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px var(--glow);
}

#sel { display: none; }

@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  aside { position: fixed; left: 0; top: 0; width: 100%; height: auto; max-height: 60vh; overflow-y: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 12px 8px; z-index: 10; }
  aside h1 { font-size: 18px; margin: 8px 4px; }
  aside p { margin: 0 4px 8px; }
  .dept { padding: 8px 8px; margin: 2px 0; }
  #sel { display: block; width: 100%; margin-bottom: 12px; margin-top: 60vh; }
  main { padding: 16px; margin-top: 0; }
  .top { flex-direction: column; align-items: flex-start; margin-bottom: 12px; }
  .top h2 { font-size: 26px; }
  .tools { flex-direction: column; }
  input[type=search], select { width: 100%; }
  .id { width: 100%; max-height: 80vh; }
  tbody { animation: none; }
  tbody tr { animation: none; }
}

@media (max-width: 480px) {
  main { padding: 12px; }
  .top h2 { font-size: 22px; }
  .id { padding: 16px; border-radius: 12px; }
  .id h3 { font-size: 20px; }
  .id dl { grid-template-columns: 1fr; gap: 8px; }
  .btns { flex-direction: column; }
  .btns a, .btns button { width: 100%; }
  .dept { font-size: 14px; }
  td { padding: 8px 10px; }
  th { padding: 8px 10px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>🚀 Directory</h1>
    <p id="tot"></p>
    <nav id="nav"></nav>
  </aside>
  <main>
    <select id="sel" aria-label="Department"></select>
    <div class="top">
      <h2 id="dn"></h2>
      <span id="cnt"></span>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search by name, admission #, phone...">
      <select id="course" aria-label="Course"></select>
      <select id="bg" aria-label="Blood group"></select>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr id="hd"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No students match. Clear filters to try again.</div>
    </div>
  </main>
</div>

<div id="card" role="dialog" aria-modal="true">
  <div class="id" id="idc"></div>
</div>

<script>
const DATA = {
  "Computer Science": [
    {"name": "Jamshidhrahman", "adm": "1098", "course": "Bsc computer science", "batch": "2026 to 2029", "addr": "Vandithavalam", "mob": "7025513859", "bg": "O+", "dob": "03/05/2025", "parent": "Thajudeen", "url": "https://drive.google.com/open?id=1jCdw_VEBZymnr-VahoG1wNfwPlEa4Iiz", "ts": "9/16/2026 12:38:18", "i": 1},
    {"name": "Anil Praveesh A P", "adm": "260596", "course": "BSS (Hons) Computer science", "batch": "2026-30", "addr": "Arimbrathodi house kottekad, Palakkad, 678732 90370421", "mob": "", "bg": "", "dob": "17 - 10/09", "parent": "/2007 Praveesh Kumar C", "url": "https://drive.google.com/open?id=1PnaoF1SCAuYe4_1aWzjL90wlZ1u5tnjT", "ts": "9/17/2026 17:35:10", "i": 157},
    {"name": "ATHIRA R", "adm": "260173", "course": "BSC Computer Science", "batch": "First year UG", "addr": "Kothamangalam House Vadakkethara Pudussery", "mob": "8589936754", "bg": "B+ve", "dob": "22-03-2008", "parent": "Ramesh V", "url": "https://drive.google.com/open?id=16In8sHGRK0shuv24Jj8xuiMuI92TMBcg", "ts": "9/17/2026 17:54:05", "i": 165},
    {"name": "ANSIYA. Y", "adm": "260810", "course": "BSC. COMPUTER SCIENCE", "batch": "2026-2030", "addr": "Paruthikkad kunisseri", "mob": "9495546969", "bg": "B+ve", "dob": "18-04-2008", "parent": "YUSUFF. M", "url": "https://drive.google.com/open?id=1ZSg7Ky5favYLRUr1Wj3ayzL3GwHkcGQ3", "ts": "9/17/2026 18:47:26", "i": 188},
    {"name": "SIDDHARTH M S", "adm": "260701", "course": "B.Sc. computer science", "batch": "2026-2030", "addr": "Siddharth M S S/o satheesh kumar devinilayam vadakkethara mannapra po,palakkad,keralam", "mob": "9495683054", "bg": "AB+", "dob": "25/12/2008", "parent": "Satheesh kumar M P", "url": "https://drive.google.com/open?id=1z32J90xD7oPD7AM2sumUvnLk8tGVLYmn", "ts": "9/17/2026 20:39:53", "i": 238},
    {"name": "Nayana. A", "adm": "260268", "course": "Bsc. Computer Science", "batch": "2026-2030", "addr": "Kumbaran kolumbu, Karippode(po)Palakkad", "mob": "7034916727", "bg": "A+ve", "dob": "16/02/2008", "parent": "Anil Kumar", "url": "https://drive.google.com/open?id=1iVxGcCFh_7wnSxVTWVL8FU5V5R4E2EGcg", "ts": "9/18/2026 8:15:22", "i": 285}
  ]
};

const cols = [['name','Name'],['adm','Admn No'],['course','Course'],['batch','Batch'],['mob','Mobile'],['bg','Blood']];
const depts = Object.keys(DATA).sort((a,b) => DATA[b].length - DATA[a].length);
let cur = depts[0], sortK = 'name', asc = true;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const total = depts.reduce((a,d) => a + DATA[d].length, 0);
$('tot').textContent = total + ' students in ' + depts.length + ' departments';
$('nav').innerHTML = depts.map(d => `<button class="dept" data-d="${esc(d)}"><span>${esc(d)}</span><b>${DATA[d].length}</b></button>`).join('');
$('sel').innerHTML = depts.map(d => `<option value="${esc(d)}">${esc(d)} (${DATA[d].length})</option>`).join('');
$('hd').innerHTML = cols.map(c => `<th data-k="${c[0]}">${c[1]}<span></span></th>`).join('');

function setDept(d) { cur = d; $('q').value = ''; fillFilters(); render(); }

function fillFilters() {
  const rs = DATA[cur];
  const u = k => [...new Set(rs.map(r => r[k]).filter(Boolean))].sort();
  $('course').innerHTML = '<option value="">All courses</option>' + u('course').map(v => `<option>${esc(v)}</option>`).join('');
  $('bg').innerHTML = '<option value="">All blood groups</option>' + u('bg').map(v => `<option>${esc(v)}</option>`).join('');
}

function render() {
  document.querySelectorAll('.dept').forEach(b => b.setAttribute('aria-current', b.dataset.d === cur));
  $('sel').value = cur;
  $('dn').textContent = cur;
  const q = $('q').value.toLowerCase().trim();
  const c = $('course').value;
  const b = $('bg').value;
  let rs = DATA[cur].filter(r => (!c || r.course === c) && (!b || r.bg === b) && (!q || [r.name, r.adm, r.mob, r.addr, r.parent, r.course].join(' ').toLowerCase().includes(q)));
  rs = [...rs].sort((x,y) => String(x[sortK]).localeCompare(String(y[sortK]), undefined, {numeric: true, sensitivity: 'base'}) * (asc ? 1 : -1));
  $('cnt').textContent = rs.length + ' of ' + DATA[cur].length + ' shown';
  $('empty').hidden = rs.length > 0;
  $('rows').innerHTML = rs.map((r,i) => `<tr data-i="${r.i}" style="animation-delay:${i*30}ms"><td class="n">${esc(r.name)}</td><td>${esc(r.adm)}</td><td>${esc(r.course)}</td><td class="m">${esc(r.batch)}</td><td>${esc(r.mob)}</td><td>${esc(r.bg)}</td></tr>`).join('');
  document.querySelectorAll('#hd th').forEach(t => t.lastChild.textContent = t.dataset.k === sortK ? (asc ? ' ▲' : ' ▼') : '');
}

function show(i) {
  const r = DATA[cur].find(x => x.i == i);
  if (!r) return;
  const f = (k,v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  $('idc').innerHTML = `<h3>${esc(r.name)}</h3><div class="sub">${esc(r.course)}${r.batch ? ' · ' + esc(r.batch) : ''}</div><dl>${f('Admission no',r.adm)}${f('Department',cur)}${f('Mobile',r.mob)}${f('Blood group',r.bg)}${f('Date of birth',r.dob)}${f('Parent',r.parent)}${f('Address',r.addr)}${f('Submitted',r.ts)}</dl><div class="btns">${r.url ? `<a class="p" href="${esc(r.url)}" target="_blank" rel="noopener">📸 Open photo</a>` : ''}${r.mob ? `<a href="tel:${esc(r.mob)}">☎️ Call</a>` : ''}<button id="x">✕ Close</button></div>`;
  $('card').classList.add('on');
  $('x').focus();
  $('x').onclick = () => $('card').classList.remove('on');
}

$('nav').onclick = e => { const b = e.target.closest('.dept'); if (b) setDept(b.dataset.d); };
$('sel').onchange = e => setDept(e.target.value);
['q','course','bg'].forEach(id => $(id).addEventListener('input', render));
$('hd').onclick = e => { const t = e.target.closest('th'); if (!t) return; asc = sortK === t.dataset.k ? !asc : true; sortK = t.dataset.k; render(); };
$('rows').onclick = e => { const t = e.target.closest('tr'); if (t) show(t.dataset.i); };
$('card').onclick = e => { if (e.target.id === 'card') $('card').classList.remove('on'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('card').classList.remove('on'); });

fillFilters();
render();
</script>
</body>
</html>
